name: Build

on:
  push:
  pull_request:
    branches: [$default-branch]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2", "3.3", "3.4"]
        gemfile:
          - Gemfile
          - test/ci/rails72.gemfile
          - test/ci/rails71.gemfile

    env:
      ROOT_BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run tests
        run: bundle exec rake

  all-tests-green:
    name: All tests green
    runs-on: ubuntu-latest
    needs: test
    # Runs even on matrix failure: a skipped job would report as successful to
    # branch protection, turning a failing run into a mergeable pull request.
    if: ${{ !cancelled() }}
    steps:
      - run: |
          echo "tests: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ]
